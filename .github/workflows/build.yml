name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  # PR pushes supersede each other; main builds must run to completion so
  # every landed commit gets its package job.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test-and-lint:
    name: Tests + Lint (debug + release)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permission for gradlew
        run: chmod +x gradlew

      - name: Spotless / ktlint check
        run: ./gradlew --no-daemon spotlessCheck

      - name: Architecture smoke test
        run: ./gradlew --no-daemon checkArchitecture

      - name: Run unit tests (debug + release variants)
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest

      - name: Run lint (debug + release variants)
        run: ./gradlew --no-daemon lintDebug lintRelease

      # Release builds minify with an empty keep-rules file; without this step
      # an R8 regression (from any dependency bump) would only surface on a
      # signed main build. Runs without signing secrets on every PR.
      - name: R8 release smoke (unsigned)
        run: ./gradlew --no-daemon :app:minifyReleaseWithR8

      - name: Aggregate code coverage (Kover)
        run: ./gradlew --no-daemon koverHtmlReport koverXmlReport koverVerify

      - name: Print coverage summary
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('build/reports/kover/report.xml').getroot()
          for kind in ('LINE', 'INSTRUCTION', 'BRANCH'):
              c = root.find(f'counter[@type="{kind}"]')
              covered = int(c.get('covered'))
              missed = int(c.get('missed'))
              total = covered + missed
              pct = (100.0 * covered / total) if total else 0
              print(f'{kind:<12} {covered:>6}/{total:<6} {pct:>5.1f}%')
          PY

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kover-report
          path: |
            build/reports/kover/html/**
            build/reports/kover/report.xml
          retention-days: 14

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  package:
    name: Package release artifacts
    runs-on: ubuntu-latest
    needs: test-and-lint
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permission for gradlew
        run: chmod +x gradlew

      - name: Check release signing secrets
        id: signing
        env:
          HYPE_RELEASE_KEYSTORE_BASE64: ${{ secrets.HYPE_RELEASE_KEYSTORE_BASE64 }}
          HYPE_RELEASE_STORE_FILE_SECRET: ${{ secrets.HYPE_RELEASE_STORE_FILE }}
          HYPE_RELEASE_STORE_PASSWORD: ${{ secrets.HYPE_RELEASE_STORE_PASSWORD }}
          HYPE_RELEASE_KEY_ALIAS: ${{ secrets.HYPE_RELEASE_KEY_ALIAS }}
          HYPE_RELEASE_KEY_PASSWORD: ${{ secrets.HYPE_RELEASE_KEY_PASSWORD }}
        run: |
          has_store=false
          if [ -n "$HYPE_RELEASE_KEYSTORE_BASE64" ] || [ -n "$HYPE_RELEASE_STORE_FILE_SECRET" ]; then
            has_store=true
          fi

          if [ "$has_store" = true ] &&
             [ -n "$HYPE_RELEASE_STORE_PASSWORD" ] &&
             [ -n "$HYPE_RELEASE_KEY_ALIAS" ] &&
             [ -n "$HYPE_RELEASE_KEY_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "### Release artifacts skipped"
              echo
              echo "Signed APK/AAB packaging requires these repository secrets:"
              echo
              echo "- \`HYPE_RELEASE_KEYSTORE_BASE64\` or \`HYPE_RELEASE_STORE_FILE\`"
              echo "- \`HYPE_RELEASE_STORE_PASSWORD\`"
              echo "- \`HYPE_RELEASE_KEY_ALIAS\`"
              echo "- \`HYPE_RELEASE_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Skipping release artifacts because release signing secrets are not fully configured."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore release keystore
        if: steps.signing.outputs.available == 'true'
        env:
          HYPE_RELEASE_KEYSTORE_BASE64: ${{ secrets.HYPE_RELEASE_KEYSTORE_BASE64 }}
          HYPE_RELEASE_STORE_FILE_SECRET: ${{ secrets.HYPE_RELEASE_STORE_FILE }}
        run: |
          if [ -n "$HYPE_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/hype-signing"
            printf '%s' "$HYPE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hype-signing/release.jks"
            echo "HYPE_RELEASE_STORE_FILE=$RUNNER_TEMP/hype-signing/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$HYPE_RELEASE_STORE_FILE_SECRET" ]; then
            echo "HYPE_RELEASE_STORE_FILE=$HYPE_RELEASE_STORE_FILE_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Assemble signed release APK + AAB
        if: steps.signing.outputs.available == 'true'
        env:
          HYPE_RELEASE_STORE_PASSWORD: ${{ secrets.HYPE_RELEASE_STORE_PASSWORD }}
          HYPE_RELEASE_KEY_ALIAS: ${{ secrets.HYPE_RELEASE_KEY_ALIAS }}
          HYPE_RELEASE_KEY_PASSWORD: ${{ secrets.HYPE_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon -PrequireReleaseSigning=true :app:assembleRelease :app:bundleRelease

      - name: Upload release artifacts
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          retention-days: 30

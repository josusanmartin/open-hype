name: release

# Pushing a version tag packages the app and publishes a GitHub Release with
# the artifacts attached — the durable download channel for a sideloaded app
# (main-branch CI artifacts expire after 30 days).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Package + publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle wrapper + caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest

      - name: Restore release keystore
        env:
          HYPE_RELEASE_KEYSTORE_BASE64: ${{ secrets.HYPE_RELEASE_KEYSTORE_BASE64 }}
          HYPE_RELEASE_STORE_FILE_SECRET: ${{ secrets.HYPE_RELEASE_STORE_FILE }}
        run: |
          if [ -n "$HYPE_RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/hype-signing"
            printf '%s' "$HYPE_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hype-signing/release.jks"
            echo "HYPE_RELEASE_STORE_FILE=$RUNNER_TEMP/hype-signing/release.jks" >> "$GITHUB_ENV"
          elif [ -n "$HYPE_RELEASE_STORE_FILE_SECRET" ]; then
            echo "HYPE_RELEASE_STORE_FILE=$HYPE_RELEASE_STORE_FILE_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Assemble release APK + AAB and debug APK
        env:
          HYPE_RELEASE_STORE_PASSWORD: ${{ secrets.HYPE_RELEASE_STORE_PASSWORD }}
          HYPE_RELEASE_KEY_ALIAS: ${{ secrets.HYPE_RELEASE_KEY_ALIAS }}
          HYPE_RELEASE_KEY_PASSWORD: ${{ secrets.HYPE_RELEASE_KEY_PASSWORD }}
        # Unsigned when secrets are absent (validateReleaseSigning warns); the
        # release notes below say which one shipped.
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:bundleRelease

      - name: Stage versioned artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p staged
          cp app/build/outputs/apk/debug/*.apk "staged/hype-car-$version-debug-installable.apk"
          cp app/build/outputs/apk/release/*.apk "staged/hype-car-$version-release.apk"
          cp app/build/outputs/bundle/release/*.aab "staged/hype-car-$version-release.aab"
          ls -la staged

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            staged/*

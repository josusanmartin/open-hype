name: Feature request
description: A change you'd like to see.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing pain point. Avoid jumping to a solution.
      placeholder: e.g. "When I sync favorites with limited data, every song re-downloads on each sync."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction (optional)
      description: A sketch of what you have in mind. Implementation details welcome but not required.
  - type: dropdown
    id: surface
    attributes:
      label: Where would this surface?
      multiple: true
      options:
        - Phone UI
        - Android Auto / AAOS
        - Background sync / offline
        - Settings
        - Other
    validations:
      required: true
